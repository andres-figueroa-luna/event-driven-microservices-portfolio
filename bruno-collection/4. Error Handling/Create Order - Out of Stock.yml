info:
  name: Create Order - Out of Stock
  type: http
  seq: 1

http:
  method: POST
  url: "{{orderUrl}}/api/orders"
  body:
    type: json
    data: |-
      {
        "quantity": 100
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
