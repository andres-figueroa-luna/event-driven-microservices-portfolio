info:
  name: Create Product
  type: http
  seq: 2

http:
  method: POST
  url: "{{inventoryUrl}}/api/products"
  body:
    type: json
    data: |-
      {
        "sku": "LAPTOP-ROG-001",
        "stock": 10
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("productId", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
