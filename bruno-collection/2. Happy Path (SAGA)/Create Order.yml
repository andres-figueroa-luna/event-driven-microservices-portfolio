info:
  name: Create Order
  type: http
  seq: 1

http:
  method: POST
  url: "{{orderUrl}}/api/orders"
  body:
    type: json
    data: |-
      {
        "sku": "LAPTOP-ROG-001",
        "quantity": 2
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("orderId", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
